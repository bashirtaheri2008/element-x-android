name: APK Build

on:
  workflow_dispatch:
  push:
    branches: [ develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  build:
    name: Build ARM32 Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          lfs: false

      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Assemble Release APK
        run: ./gradlew :app:assembleGplayRelease $CI_GRADLE_ARG_PROPERTIES

      - name: Upload ARM32 APK
        uses: actions/upload-artifact@v4
        with:
          name: hamgab-arm32
          path: app/build/outputs/apk/gplay/release/*-armeabi-v7a-release.apk
